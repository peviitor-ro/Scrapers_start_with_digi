
# Daily repair run for scrapers that returned no jobs.
#
# scrapers_runner.yml runs first (19:00 UTC) and only detects empty scrapers,
# recording them in .cache. This workflow picks them up from there, oldest
# first, at most 10 per day (OPENCODE_EMPTY_JOBS_REPAIR_DAILY_BUDGET).
# Scheduled at 05:00 UTC so it never overlaps with the detection run.

name: Daily empty-jobs repair queue

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.repository.fork == false }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install OpenCode
        run: npm install -g opencode-ai@latest

      - name: Verify OpenCode installation
        run: opencode --version

      - name: Restore empty-jobs repair state
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: empty-jobs-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            empty-jobs-${{ runner.os }}-

      - name: Repair queued scrapers
        env:
          EMAIL: ${{ secrets.EMAIL }}
        run: |
          python3 sites/__main_RunnerFile.py --repair-backlog

      - name: Save empty-jobs repair state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: empty-jobs-${{ runner.os }}-${{ github.run_id }}

      - name: Commit and push changes if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update scraper outputs"
          git push
